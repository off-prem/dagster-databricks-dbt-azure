# Skeleton — serverless, triggered SDP pipeline writing to ${var.catalog}.bronze
resources:
  pipelines:
    bronze_pipeline:
      name: bronze_source_pipeline
      serverless: true
      continuous: false
      catalog: ${var.catalog}
      target: bronze
      libraries:
        - file:
            path: ../src/bronze_ingest.py
      configuration:
        source_url: ${var.source_url}
