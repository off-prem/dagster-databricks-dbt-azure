# Deploys ingestion code to the workspace for Dagster Pipes to submit.
# Workspace host is NOT committed; the bundle CLI reads DATABRICKS_HOST from the environment.
# Set it before running: DATABRICKS_HOST=$DBX_STAGE_HOST databricks bundle deploy -t stage
# Or use: scripts/bundle-deploy.sh stage
bundle:
  name: dagster

variables:
  catalog:
    description: Unity Catalog catalog for this environment

# include:
#   - resources/*.yml

targets:
  stage:
    mode: production
    variables:
      catalog: stage
  prod:
    mode: production
    variables:
      catalog: prod
