# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ Databricks Asset Bundle configuration                                     │
# │                                                                           │
# │ A "bundle" is Databricks' way of packaging and deploying code to a        │
# │ workspace. Think of it like a deployment package: it uploads local files   │
# │ (Python scripts, config) to the Databricks workspace so that jobs and     │
# │ notebooks can reference them.                                             │
# │                                                                           │
# │ In this project, Dagster doesn't run Spark code itself — it submits       │
# │ jobs to Databricks via "Dagster Pipes." The bundle deploys the Python     │
# │ scripts (src/extract/) that those submitted jobs run.                     │
# │                                                                           │
# │ Deploy with: scripts/bundle-deploy.sh stage                              │
# │   (or: DATABRICKS_HOST=$DBX_STAGE_HOST databricks bundle deploy -t stage) │
# │                                                                           │
# │ The workspace host URL is NOT committed here — the Databricks CLI reads   │
# │ DATABRICKS_HOST from the environment. This keeps the config portable      │
# │ across different workspace URLs.                                          │
# └─────────────────────────────────────────────────────────────────────────────┘
bundle:
  name: dagster

# Variables are parameterized values that differ per target (stage vs prod).
# They're referenced in resource definitions with ${var.catalog}.
variables:
  catalog:
    description: Unity Catalog catalog for this environment
  ci_sp_client_id:
    description: OIDC service principal application ID (AZURE_CLIENT_ID) — grants CI deploy access
  run_as_sp_client_id:
    description: Per-env Databricks service principal application ID — runs jobs and has CAN_MANAGE

# Uncomment this to split resource definitions (jobs, pipelines) into
# separate YAML files in a resources/ directory:
# include:
#   - resources/*.yml

# Targets are like environments. Each target sets its own variable values.
# `mode: production` enables stricter validation and deploys to the workspace's
# production area (/Workspace/.bundle/dagster/<target>/files/).
workspace:
  root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}

# Grant the CI service principal (OIDC app) CAN_MANAGE so it can deploy.
# The run_as identity is the per-env Databricks SP that runs jobs.
# You must redeploy from your own account once after adding these so the
# existing state directory picks up the new permissions.
permissions:
  - service_principal_name: ${var.ci_sp_client_id}
    level: CAN_MANAGE
  - service_principal_name: ${var.run_as_sp_client_id}
    level: CAN_MANAGE

targets:
  stage:
    mode: production
    variables:
      catalog: stage     # maps to the Unity Catalog "stage" catalog
  prod:
    mode: production
    variables:
      catalog: prod      # maps to the Unity Catalog "prod" catalog
