[project]
name = "poc"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.10,<2",
    "dagster-webserver>=1.10,<2",
    "dagster-databricks>=0.26,<1",
    "dagster-dbt>=0.26,<1",
    "dbt-databricks>=1.9,<2",
    "dagster-dg>=0.2.2",
]

[project.entry-points."dagster.components"]
poc = "poc"

[tool.uv]
required-version = ">=0.11"

[tool.dg]
is_code_location = true

[tool.dagster]
module_name = "poc"
