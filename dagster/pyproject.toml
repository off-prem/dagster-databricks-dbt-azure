[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poc"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster~=1.13.26",
    "dagster-webserver~=1.13.26",
    "dagster-databricks~=0.29.26",
    "dagster-dbt~=0.29.26",
    "dbt-databricks>=1.9,<2",
    "dagster-dg>=0.2.2",
    "dagster-postgres~=0.29.26",
    "dagster-k8s~=0.29.26",
    # dagster-postgres uses bare postgresql:// URLs (no +psycopg2 driver suffix).
    # SQLAlchemy 2.1 changed the default driver to psycopg v3, which breaks
    # dagster-postgres's NOTIFY SQL. Pin until dagster-postgres fixes this.
    "sqlalchemy>=2.0,<2.1",
]

[project.entry-points."dagster.components"]
poc = "poc"

[tool.uv]
required-version = ">=0.11"


[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "poc"

[tool.dagster]
module_name = "poc"
