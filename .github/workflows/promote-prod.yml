name: promote-prod
on:
  workflow_run:
    workflows: [deploy-stage]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha: { description: "Git SHA to promote (rollback)", required: true }
permissions: { id-token: write, contents: read }
concurrency: { group: deploy-prod, cancel-in-progress: false }

env:
  TF_VAR_project: ${{ vars.TF_VAR_PROJECT || 'dagster' }}

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Resolve SHA
        id: sha
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create stub .env for CI
        run: touch .env

      # ── Helm deploy to prod (same image SHA — no rebuild) ────────────────
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.22.1"

      - name: Add Dagster Helm repo
        run: helm repo add dagster https://dagster-io.github.io/helm && helm repo update

      - name: Install kubelogin
        run: |
          curl -fsSL https://github.com/Azure/kubelogin/releases/download/v0.2.22/kubelogin-linux-amd64.zip -o kubelogin.zip
          unzip -o kubelogin.zip -d kubelogin-tmp
          sudo mv kubelogin-tmp/bin/linux_amd64/kubelogin /usr/local/bin/kubelogin
          rm -rf kubelogin.zip kubelogin-tmp

      - name: Get AKS credentials
        run: |
          PROJECT="${{ env.TF_VAR_project }}"
          az aks get-credentials \
            --resource-group "rg-${PROJECT}-shared" \
            --name "aks-${PROJECT}" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Allow runner IP on AKS API server
        id: aks-ip
        run: |
          PROJECT="${{ env.TF_VAR_project }}"
          RG="rg-${PROJECT}-shared"
          CLUSTER="aks-${PROJECT}"
          RUNNER_IP="$(curl -sf https://ifconfig.me)/32"
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          CURRENT=$(az aks show -g "$RG" -n "$CLUSTER" \
            --query "join(',', apiServerAccessProfile.authorizedIpRanges)" -o tsv)
          echo "original_ranges=${CURRENT}" >> "$GITHUB_OUTPUT"
          az aks update -g "$RG" -n "$CLUSTER" \
            --api-server-authorized-ip-ranges "${CURRENT},${RUNNER_IP}"
          echo "Authorized runner IP ${RUNNER_IP} on AKS"

      - name: Wait for AKS API server to accept runner IP
        run: |
          echo "Waiting for AKS API server to become reachable (up to 3 min)..."
          for i in $(seq 1 18); do
            if kubectl cluster-info >/dev/null 2>&1; then
              echo "AKS API server reachable after $((i * 10))s"
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "AKS API server still unreachable after 180s" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Helm upgrade (prod)
        run: |
          scripts/helm-upgrade.sh prod \
            --set "dagster-user-deployments.deployments[0].image.tag=${{ steps.sha.outputs.sha }}"
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
          PG_FQDN: ${{ vars.PG_FQDN }}
          DBX_PROD_HOST: ${{ vars.DBX_PROD_HOST }}
          DBX_PROD_WAREHOUSE_HTTP_PATH: ${{ vars.DBX_PROD_WAREHOUSE_HTTP_PATH }}
          DAGSTER_PROD_IDENTITY_CLIENT_ID: ${{ vars.DAGSTER_PROD_IDENTITY_CLIENT_ID }}

      # ── Bundle deploy to prod (same SHA) ─────────────────────────────────
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Allow runner IP on Databricks workspace
        id: dbx-ip
        run: |
          set -o pipefail
          RUNNER_IP="${{ steps.aks-ip.outputs.runner_ip }}"
          LIST_ID=$(databricks ip-access-lists create \
            "ci-runner-${GITHUB_RUN_ID}" ALLOW \
            --json "{\"ip_addresses\": [\"${RUNNER_IP}\"]}" \
            --output json | jq -r '.ip_access_list.list_id')
          echo "list_id=${LIST_ID}" >> "$GITHUB_OUTPUT"
          echo "Allowed runner IP ${RUNNER_IP} on Databricks (list ${LIST_ID})"
        env:
          DATABRICKS_HOST: ${{ vars.DBX_PROD_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli

      - name: Bundle deploy (prod)
        run: scripts/bundle-deploy.sh prod
        env:
          DBX_PROD_HOST: ${{ vars.DBX_PROD_HOST }}
          DBX_PROD_SP_CLIENT_ID: ${{ vars.DBX_PROD_SP_CLIENT_ID }}

      # ── Smoke test ───────────────────────────────────────────────────────
      - name: Smoke test (prod)
        run: scripts/smoke-test.sh prod
        env:
          TF_VAR_project: ${{ env.TF_VAR_project }}

      # ── Cleanup ──────────────────────────────────────────────────────────
      - name: Remove runner IP from Databricks workspace
        if: always() && steps.dbx-ip.outputs.list_id
        run: |
          databricks ip-access-lists delete "${{ steps.dbx-ip.outputs.list_id }}"
          echo "Removed CI runner IP access list"
        env:
          DATABRICKS_HOST: ${{ vars.DBX_PROD_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli

      - name: Remove runner IP from AKS API server
        if: always() && steps.aks-ip.outputs.original_ranges
        run: |
          PROJECT="${{ env.TF_VAR_project }}"
          az aks update \
            -g "rg-${PROJECT}-shared" \
            -n "aks-${PROJECT}" \
            --api-server-authorized-ip-ranges "${{ steps.aks-ip.outputs.original_ranges }}"
          echo "Restored AKS authorized IPs"
