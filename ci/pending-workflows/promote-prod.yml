name: promote-prod
on:
  workflow_run:
    workflows: [deploy-stage]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha: { description: "Git SHA to promote (rollback)", required: true }
permissions: { id-token: write, contents: read }
concurrency: { group: deploy-prod, cancel-in-progress: false }
jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: prod   # required reviewer configured in GitHub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # TODO (Phase 5.3): same SHA → helm upgrade dagster-prod → bundle deploy -t prod → scripts/smoke-test.sh prod
      - run: echo "promote-prod skeleton — see docs/concepts/cicd.md"
