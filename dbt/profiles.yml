poc:
  target: "{{ env_var('DAGSTER_ENV', 'stage') }}"
  outputs:
    stage: &out
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DBX_WAREHOUSE_HTTP_PATH') }}"
      catalog: "{{ env_var('DBX_CATALOG') }}"
      schema: silver
      auth_type: oauth
      client_id: "{{ env_var('DBX_SP_CLIENT_ID') }}"
      client_secret: "{{ env_var('DBX_SP_SECRET') }}"
      threads: 2
    prod:
      <<: *out
