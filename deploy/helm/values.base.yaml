# Dagster chart base values — shared by stage and prod. Claude completes in Phase 2.6.
# Per-user values (image repo, Postgres host) are overridden by scripts/helm-upgrade.sh
# from .env — they are never committed with real values.
postgresql:
  enabled: false
generatePostgresqlPasswordSecret: false
dagsterWebserver:
  service:
    type: ClusterIP
runLauncher:
  type: K8sRunLauncher
dagster-user-deployments:
  enabled: true
  deployments:
    - name: poc
      image:
        repository: ""   # overridden: ${ACR_LOGIN_SERVER}/poc
        tag: ""          # overridden: set by CI or scripts/helm-upgrade.sh
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs: ["-m", "poc.definitions"]
      port: 3030
