# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ Stage environment overrides                                               │
# │                                                                           │
# │ This file layers on top of values.base.yaml for the stage environment.    │
# │ The diff between this and values.prod.yaml should be trivial — only       │
# │ env-specific names (database name, catalog name, secret names).           │
# │                                                                           │
# │ Per-user values are overridden by scripts/helm-upgrade.sh from .env.      │
# └─────────────────────────────────────────────────────────────────────────────┘

global:
  # The name of the K8s Secret containing the Postgres password. This Secret
  # is created automatically by the CSI Secrets Store driver (see the
  # SecretProviderClass in deploy/k8s/stage/). The Dagster chart reads the
  # "postgresql-password" key from this Secret to build the connection string.
  postgresqlSecretName: dagster-postgres

postgresql:
  postgresqlHost: ""        # overridden: ${PG_FQDN}
  postgresqlDatabase: dagster_stage     # matches the DB created in shared/main.tf
  postgresqlUsername: pgadmin           # the Postgres admin user
  postgresqlParams:
    sslmode: require        # Azure Postgres requires TLS connections

dagster-user-deployments:
  deployments:
    - name: poc
      # This pod label tells AKS to inject a workload identity token for the
      # service account. Without it, the CSI Secrets Store driver can't
      # authenticate to Key Vault.
      labels:
        azure.workload.identity/use: "true"
      # Environment variables available to your Dagster code at runtime.
      # Some have placeholder values that helm-upgrade.sh fills from .env.
      env:
        - name: DAGSTER_ENV
          value: stage
        - name: DBX_CATALOG
          value: stage                # Unity Catalog catalog name
        - name: DATABRICKS_HOST
          value: ""         # overridden: ${DBX_STAGE_HOST}
        - name: DBX_BUNDLE_ROOT
          value: ""         # overridden: /Workspace/.bundle/dagster/stage/files
        - name: DBX_WAREHOUSE_HTTP_PATH
          value: ""         # overridden: ${DBX_STAGE_WAREHOUSE_HTTP_PATH}
      # envSecrets maps K8s Secret keys to pod env vars. The dagster-dbx-stage
      # Secret (synced from Key Vault by the SecretProviderClass) contains
      # DBX_SP_CLIENT_ID, DBX_SP_SECRET, and SOURCE_POSTS_API_KEY.
      envSecrets:
        - name: dagster-dbx-stage
