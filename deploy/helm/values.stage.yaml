# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ Stage environment values                                                    │
# │                                                                             │
# │ This file layers on top of values.base.yaml for the stage environment.      │
# │ It is processed by envsubst in scripts/helm-upgrade.sh, which resolves      │
# │ ${VAR} placeholders from .env before passing it to Helm.                    │
# │                                                                             │
# │ The deployment spec must be COMPLETE here (image, port, volumes, etc.)      │
# │ because Helm replaces arrays rather than merging them — fields defined      │
# │ only in values.base.yaml would be lost.                                     │
# │                                                                             │
# │ The diff between this and values.prod.yaml should be trivial — only         │
# │ env-specific names (database name, catalog name, secret names).             │
# └─────────────────────────────────────────────────────────────────────────────┘

global:
  postgresqlSecretName: dagster-postgres

postgresql:
  postgresqlHost: "${PG_FQDN}"
  postgresqlDatabase: dagster_stage
  postgresqlUsername: pgadmin
  postgresqlParams:
    sslmode: require

serviceAccount:
  name: "${RELEASE}"
  annotations:
    azure.workload.identity/client-id: "${IDENTITY_CLIENT_ID}"

runLauncher:
  config:
    k8sRunLauncher:
      envVars:
        - "DAGSTER_ENV=stage"
        - "DBX_CATALOG=stage"
        - "DATABRICKS_HOST=${DBX_HOST}"
        - "DBX_BUNDLE_ROOT=${DBX_BUNDLE_ROOT}"
        - "DBX_WAREHOUSE_HTTP_PATH=${DBX_WAREHOUSE}"
        - "DBT_PROFILES_DIR=/app/dbt"
      envSecrets:
        - name: dagster-dbx-stage
      labels:
        azure.workload.identity/use: "true"
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: dagster-secrets
      volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true

dagster-user-deployments:
  serviceAccount:
    create: false
    name: "${RELEASE}"
  deployments:
    - name: poc
      image:
        repository: "${ACR_LOGIN_SERVER}/poc"
        tag: latest
        pullPolicy: Always
      dagsterApiGrpcArgs: ["-m", "poc.definitions"]
      port: 3030
      labels:
        azure.workload.identity/use: "true"
      env:
        - name: DAGSTER_ENV
          value: stage
        - name: DBX_CATALOG
          value: stage
        - name: DATABRICKS_HOST
          value: "${DBX_HOST}"
        - name: DBX_BUNDLE_ROOT
          value: "${DBX_BUNDLE_ROOT}"
        - name: DBX_WAREHOUSE_HTTP_PATH
          value: "${DBX_WAREHOUSE}"
        - name: DBT_PROFILES_DIR
          value: /app/dbt
      envSecrets:
        - name: dagster-dbx-stage
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 512Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: dagster-secrets
      volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
