# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ Prod environment overrides                                                │
# │                                                                           │
# │ Same structure as values.stage.yaml — diff should be trivial (just env-   │
# │ specific names). Per-user values overridden by helm-upgrade.sh from .env. │
# └─────────────────────────────────────────────────────────────────────────────┘

global:
  postgresqlSecretName: dagster-postgres

postgresql:
  postgresqlHost: ""        # overridden: ${PG_FQDN}
  postgresqlDatabase: dagster_prod
  postgresqlUsername: pgadmin
  postgresqlParams:
    sslmode: require

dagster-user-deployments:
  deployments:
    - name: poc
      labels:
        azure.workload.identity/use: "true"
      env:
        - name: DAGSTER_ENV
          value: prod
        - name: DBX_CATALOG
          value: prod
        - name: DATABRICKS_HOST
          value: ""         # overridden: ${DBX_PROD_HOST}
        - name: DBX_BUNDLE_ROOT
          value: ""         # overridden: /Workspace/.bundle/dagster/prod/files
        - name: DBX_WAREHOUSE_HTTP_PATH
          value: ""         # overridden: ${DBX_PROD_WAREHOUSE_HTTP_PATH}
      envSecrets:
        - name: dagster-dbx-prod
