# Prod environment values. Diff against values.stage.yaml must be trivial.
# Per-user values are overridden by scripts/helm-upgrade.sh from .env.
global:
  postgresqlSecretName: dagster-postgres
postgresql:
  postgresqlHost: ""        # overridden: ${PG_FQDN}
  postgresqlDatabase: dagster_prod
  postgresqlUsername: dagster_prod
dagster-user-deployments:
  deployments:
    - name: poc
      env:
        - name: DAGSTER_ENV
          value: prod
        - name: DBX_CATALOG
          value: prod
        - name: DATABRICKS_HOST
          value: ""         # overridden: ${DBX_PROD_HOST}
        - name: DBX_BRONZE_PIPELINE_ID
          value: ""         # overridden: ${DBX_PROD_PIPELINE_ID}
        - name: DBX_WAREHOUSE_HTTP_PATH
          value: ""         # overridden: ${DBX_PROD_WAREHOUSE_HTTP_PATH}
      envSecrets:
        - name: dagster-dbx-prod     # synced by SecretProviderClass
