# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ SecretProviderClass for prod — same structure as stage                    │
# │ See deploy/k8s/stage/secretproviderclass.yaml for detailed explanations.  │
# │                                                                           │
# │ BEFORE APPLYING: replace the three <PLACEHOLDER> values with real ones    │
# │ from `just show-env`. See deploy/k8s/prod/README.md for details.          │
# │                                                                           │
# │ Apply after Phase 4.3:                                                    │
# │   kubectl apply -f deploy/k8s/prod/secretproviderclass.yaml              │
# └─────────────────────────────────────────────────────────────────────────────┘
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dagster-secrets
  namespace: dagster-prod
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${DAGSTER_PROD_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KV_NAME}"
    tenantId: "${TF_VAR_tenant_id}"
    objects: |
      array:
        - |
          objectName: dbx-prod-sp-client-id
          objectType: secret
        - |
          objectName: dbx-prod-sp-secret
          objectType: secret
        - |
          objectName: source-posts-api-key
          objectType: secret
        - |
          objectName: pg-admin-password
          objectType: secret
  secretObjects:
    - secretName: dagster-dbx-prod
      type: Opaque
      data:
        - objectName: dbx-prod-sp-client-id
          key: DBX_SP_CLIENT_ID
        - objectName: dbx-prod-sp-secret
          key: DBX_SP_SECRET
        - objectName: source-posts-api-key
          key: SOURCE_POSTS_API_KEY
    - secretName: dagster-postgres
      type: Opaque
      data:
        - objectName: pg-admin-password
          key: postgresql-password
