# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ SecretProviderClass — syncs Azure Key Vault secrets into K8s Secrets      │
# │                                                                           │
# │ This is the bridge between Azure Key Vault and Kubernetes. When a pod     │
# │ mounts this as a CSI volume (see values.base.yaml), the driver:           │
# │   1. Authenticates to Key Vault using the pod's workload identity         │
# │   2. Reads the listed secrets from KV                                     │
# │   3. Creates K8s Secrets with the values (under secretObjects)            │
# │   4. Dagster pods read those K8s Secrets as environment variables          │
# │                                                                           │
# │ Placeholders use ${VAR} syntax — filled from .env via envsubst:           │
# │   envsubst < deploy/k8s/stage/secretproviderclass.yaml | kubectl apply -f -│
# │                                                                           │
# │ Apply after Phase 2.4:                                                    │
# │   kubectl apply -f deploy/k8s/stage/secretproviderclass.yaml             │
# └─────────────────────────────────────────────────────────────────────────────┘
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dagster-secrets
  namespace: dagster-stage       # must match the Helm release namespace
spec:
  provider: azure                # use the Azure Key Vault provider

  parameters:
    # Authentication method: workload identity (not pod identity or VM identity).
    # The pod's K8s service account is federated to an Azure managed identity
    # (configured in infra/env/main.tf) which has "Key Vault Secrets User" access.
    usePodIdentity: "false"
    useVMManagedIdentity: "false"

    # The Azure managed identity's client ID — tells the CSI driver which
    # identity to request a token for.
    clientID: "${DAGSTER_STAGE_IDENTITY_CLIENT_ID}"

    # Which Key Vault to read from and which Azure AD tenant it belongs to.
    keyvaultName: "${KV_NAME}"
    tenantId: "${TF_VAR_tenant_id}"

    # The list of secrets to fetch from Key Vault. Each objectName must match
    # the secret name in KV exactly (see infra/env/databricks.tf and
    # infra/shared/main.tf for where these are created).
    objects: |
      array:
        - |
          objectName: dbx-stage-sp-client-id
          objectType: secret
        - |
          objectName: dbx-stage-sp-secret
          objectType: secret
        - |
          objectName: source-posts-api-key
          objectType: secret
        - |
          objectName: pg-admin-password
          objectType: secret

  # secretObjects defines which K8s Secrets to create from the fetched KV
  # secrets. Each K8s Secret gets one or more key-value pairs mapped from
  # the KV secret names above.
  secretObjects:
    # This K8s Secret is referenced by values.stage.yaml's envSecrets section.
    # Dagster pods get these as environment variables automatically.
    - secretName: dagster-dbx-stage
      type: Opaque
      data:
        - objectName: dbx-stage-sp-client-id
          key: DBX_SP_CLIENT_ID            # env var name in the pod
        - objectName: dbx-stage-sp-secret
          key: DBX_SP_SECRET               # env var name in the pod
        - objectName: source-posts-api-key
          key: SOURCE_POSTS_API_KEY        # env var name in the pod

    # This K8s Secret is referenced by global.postgresqlSecretName in the
    # Helm values. The Dagster chart reads "postgresql-password" from it to
    # build the Postgres connection string.
    - secretName: dagster-postgres
      type: Opaque
      data:
        - objectName: pg-admin-password
          key: postgresql-password         # key the Dagster chart expects
